name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # macOS only, deliberately.
    #
    # A Linux job was tried and removed: rmlint and jq installed fine and the
    # version check passed, but the suite then hung indefinitely — cancelled
    # after 15 minutes with no output. The cause was never identified. Adding
    # it back means first reproducing that hang locally (a container, or a
    # Linux VM) rather than re-running CI and hoping.
    #
    # Consequence worth knowing: the GNU `stat -c` branch is therefore
    # covered only by the shim in test group 33, never by a real GNU
    # userland. The shim proves the branch is selected and produces correct
    # sizes; it does not prove GNU find/sed/xargs behave as assumed.
    name: test · macOS (BSD userland, bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install rmlint and jq
        run: brew install rmlint jq

      - name: Report the toolchain
        run: |
          ./salvage --version
          bash --version | head -1
          # which stat dialect this runner actually exercises
          if stat -f '%z' Makefile >/dev/null 2>&1; then
            echo "stat dialect: BSD (-f '%z')"
          elif stat -c '%s' Makefile >/dev/null 2>&1; then
            echo "stat dialect: GNU (-c '%s')"
          else
            echo "stat dialect: NEITHER — sizes will degrade"
          fi

      - name: Version consistency
        run: make check-version

      - name: Tests
        run: make test

      - name: Demo still runs
        run: make demo

  lint:
    # Advisory for now: shellcheck has never been run against this codebase,
    # so making it blocking on day one would just paint CI red. Once the
    # findings are triaged, drop the continue-on-error line below.
    name: shellcheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -S warning salvage tests/run.sh
